name: Deploy etAL to GitHub Pages

on:
    push:
        branches: ['main']

    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: etal_client

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: '22.12.0'
                  cache: npm
                  cache-dependency-path: etal_client/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build site
              run: npm run build

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v6

            - name: Upload built site
              uses: actions/upload-pages-artifact@v5
              with:
                  path: etal_client/dist

            - name: Deploy site
              id: deployment
              uses: actions/deploy-pages@v5
